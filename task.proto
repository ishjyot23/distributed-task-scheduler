syntax = "proto3";
package dts;

import "google/protobuf/empty.proto";

service SchedulerService {
  rpc SubmitBatch (BatchTaskRequest) returns (BatchTaskResponse);
  rpc GetSnapshot (google.protobuf.Empty) returns (SnapshotResponse);
  rpc SetWorkerEnabled (WorkerControlRequest) returns (ActionResponse);
  rpc RetryTask (RetryRequest) returns (ActionResponse);
  rpc RegisterWorker (RegisterWorkerRequest) returns (ActionResponse);
  rpc Heartbeat (HeartbeatRequest) returns (ActionResponse);
}

service WorkerService {
  rpc Execute (ExecuteRequest) returns (ExecuteResponse);
}

message BatchTaskRequest {
  string task_type = 1;
  string input_value = 2;
  int32 count = 3;
}
message BatchTaskResponse { repeated string task_ids = 1; }

message TaskRecord {
  string id = 1;
  string task_type = 2;
  string input_value = 3;
  string status = 4;
  string worker_id = 5;
  string result = 6;
  string error = 7;
  double created_at = 8;
  double started_at = 9;
  double finished_at = 10;
  int32 attempts = 11;
  double duration = 12;
  repeated string assignment_history = 13;
}
message WorkerRecord {
  string worker_id = 1;
  string status = 2;
  string address = 3;
  int32 capacity = 4;
  int32 active = 5;
  int32 completed = 6;
  int32 failed = 7;
  int32 assignments_total = 8;
  double last_seen = 9;
  bool enabled = 10;
}
message SnapshotResponse {
  repeated TaskRecord tasks = 1;
  repeated WorkerRecord workers = 2;
  string scheduler_status = 3;
  int32 queued = 4;
  int32 running = 5;
  int32 completed = 6;
  int32 failed = 7;
  int32 interrupted = 8;
}
message WorkerControlRequest { string worker_id = 1; bool enabled = 2; }
message RetryRequest { string task_id = 1; }
message ActionResponse { bool ok = 1; string message = 2; }
message RegisterWorkerRequest {
  string worker_id = 1;
  string address = 2;
  int32 capacity = 3;
}
message HeartbeatRequest {
  string worker_id = 1;
  int32 completed = 2;
  int32 failed = 3;
}
message ExecuteRequest {
  string task_id = 1;
  string task_type = 2;
  string input_value = 3;
}
message ExecuteResponse {
  string task_id = 1;
  string worker_id = 2;
  bool success = 3;
  string result = 4;
  string error = 5;
  double duration = 6;
}
